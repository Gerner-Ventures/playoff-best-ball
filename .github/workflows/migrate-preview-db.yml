name: Migrate preview database

# Preview deploys never migrate their own database — scripts/vercel-build.sh explains
# why: a PR must not be able to reshape a database just by being deployed. So the
# preview database follows main instead. When reviewed migrations land, apply them
# here, the same way a production deploy applies them to production. A PR that adds
# a migration therefore previews against main's schema until it merges.
on:
  push:
    branches: [main]
    paths:
      - prisma/migrations/**
      - prisma/seed-players*.ts
      - data/players-*.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-preview-db
  cancel-in-progress: false

jobs:
  migrate:
    # workflow_dispatch can target any branch, and this job runs that branch's code
    # with the database URL. Only main's code, which has been reviewed, gets to.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Direct (non-pooled) URL of the Neon integration's database, the one Vercel
      # injects into Preview. Strip `channel_binding` from it: Prisma's migration
      # engine cannot connect when it is present.
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
    steps:
      - name: Check the preview database URL is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the PREVIEW_DATABASE_URL repo secret (see docs/runbooks/schema-changes.md)"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      # Idempotent; keeps the preview player pool in step with the checked-in fixture.
      - run: npx tsx prisma/seed-players-cli.ts
